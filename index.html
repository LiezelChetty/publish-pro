<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d8342a" />
    <title>Publish Pro</title>
    <link rel="icon" type="image/svg+xml" href="/brand/publish-pro-icon.svg" />
    <link rel="mask-icon" href="/brand/publish-pro-icon.svg" color="#d8342a" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      (() => {
        const key = "publish-pro-theme";
        const stored = localStorage.getItem(key);
        const preference = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
