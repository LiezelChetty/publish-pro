name: Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  desktop-build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build desktop bundle
        run: npm run desktop:build

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-pro-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/publish-pro
            src-tauri/target/release/publish-pro.exe
            src-tauri/target/release/bundle/**/*
